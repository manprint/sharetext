services:
  sharetext:
    build:
      context: .
      args:
        VERSION: "${VERSION:-}"
    image: sharetext:local
    container_name: sharetext
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /data/sharetext.db
      SLUG_LEN: "16"
      CLEANUP_INTERVAL: "60s"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-30s}"
      VACUUM_INTERVAL: "${VACUUM_INTERVAL:-5m}"
      FILE_GRACE: "${FILE_GRACE:-60s}"
      LOCK_TTL: "${LOCK_TTL:-15s}"
      LOCK_IDLE_RELEASE: "${LOCK_IDLE_RELEASE:-3s}"
      MAX_FILE_SIZE: "${MAX_FILE_SIZE:-10485760}"
      MAX_CONTENT_SIZE: "${MAX_CONTENT_SIZE:-6291456}"
      MAX_FILES_PER_SESSION: "${MAX_FILES_PER_SESSION:-256}"
      MAX_SESSION_STORAGE_BYTES: "${MAX_SESSION_STORAGE_BYTES:-104857600}"
      FILE_STORAGE_BACKEND: "${FILE_STORAGE_BACKEND:-db}"
      FILE_STORAGE_DIR: "${FILE_STORAGE_DIR:-/data/sharetext-files}"
      SECURE_DELETE: "${SECURE_DELETE:-true}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-20}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-60}"
      RATE_LIMIT_TTL: "${RATE_LIMIT_TTL:-10m}"
      ADMIN_RATE_LIMIT_RPS: "${ADMIN_RATE_LIMIT_RPS:-5}"
      ADMIN_RATE_LIMIT_BURST: "${ADMIN_RATE_LIMIT_BURST:-15}"
      ADMIN_RATE_LIMIT_TTL: "${ADMIN_RATE_LIMIT_TTL:-10m}"
      READ_HEADER_TIMEOUT: "${READ_HEADER_TIMEOUT:-5s}"
      WRITE_TIMEOUT: "${WRITE_TIMEOUT:-30s}"
      IDLE_TIMEOUT: "${IDLE_TIMEOUT:-2m}"
      MAX_HEADER_BYTES: "${MAX_HEADER_BYTES:-1048576}"
      SECURITY_HEADERS_ENABLED: "${SECURITY_HEADERS_ENABLED:-true}"
      CONTENT_SECURITY_POLICY: "${CONTENT_SECURITY_POLICY:-default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'}"
      FRAME_OPTIONS: "${FRAME_OPTIONS:-DENY}"
      REFERRER_POLICY: "${REFERRER_POLICY:-no-referrer}"
      PERMISSIONS_POLICY: "${PERMISSIONS_POLICY:-camera=(), microphone=(), geolocation=()}"
      STRICT_TRANSPORT_SECURITY: "${STRICT_TRANSPORT_SECURITY:-max-age=31536000; includeSubDomains}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      AUDIT_LOG_ENABLED: "${AUDIT_LOG_ENABLED:-true}"
      AUDIT_LOG_DEFAULT_LIMIT: "${AUDIT_LOG_DEFAULT_LIMIT:-50}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASS: "${ADMIN_PASS:-changeme}"
      ADMIN_PASS_HASH: "${ADMIN_PASS_HASH:-}"
    volumes:
      - sharetext-data:/data
    restart: unless-stopped

volumes:
  sharetext-data:
